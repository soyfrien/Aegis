<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aegis">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <meta name="robots" content="noindex, nofollow">
  <title>Aegis</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <h1>🛡️ Aegis</h1>

    <section id="login" hidden>
      <p id="login-note" class="muted" hidden></p>
      <form id="login-form" autocomplete="on">
        <label for="passcode">Passcode</label>
        <input id="passcode" name="passcode" type="password" autocomplete="current-password" required>
        <button type="submit">Unlock</button>
      </form>
    </section>

    <section id="app" hidden>
      <form id="dl-form">
        <label for="url">Video URL</label>
        <div class="field">
          <input id="url" name="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
                 placeholder="https://www.youtube.com/watch?v=…" required>
          <button id="clear-url" type="button" class="clear" aria-label="Clear URL" title="Clear URL" hidden>
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <button id="dl-btn" type="submit">Download</button>
      </form>

      <div id="status" hidden>
        <div id="status-text"></div>
        <progress id="bar" max="100" value="0"></progress>
        <div id="job-id" class="muted"></div>
      </div>

      <div id="result" hidden>
        <a id="save" class="button" href="#">Save to Files</a>
        <button id="od-btn" type="button" class="secondary">Save to OneDrive</button>
        <div id="od-msg" class="muted"></div>
        <div id="od-device" hidden></div>
      </div>

      <p id="expires" class="muted"></p>
      <a class="footer-link" href="/stats">Server stats</a>
      <a class="footer-link" href="/shortcut">Share-sheet setup</a>
      <button id="logout" type="button" class="link">Lock</button>
    </section>

    <p id="error" role="alert" hidden></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
